<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PULSE Incidents</title>
<style>
body{margin:0;background:#050b19;color:#edf5ff;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:32px 22px}a{color:#94b3de;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.logo{font-weight:900;letter-spacing:4px;font-size:24px;color:#fff}.btn{border:1px solid #234c7e;background:#0a1c39;border-radius:9px;padding:10px 13px;color:#c6daf5}.card{border:1px solid #173a68;background:#091831;border-radius:14px;padding:20px;margin:12px 0}.row{display:grid;grid-template-columns:1fr auto;gap:14px}.title{font-size:18px;font-weight:800}.meta{color:#91a9cb;font-size:12px;margin-top:8px;line-height:1.7}.badge{display:inline-block;padding:6px 9px;border-radius:8px;background:#582033;color:#ff9aab;font-size:11px;font-weight:800}.rca{margin-top:12px;padding:12px;border-left:3px solid #47e5a0;background:#07182e;border-radius:8px}.empty{color:#91a9cb;padding:30px;text-align:center}@media(max-width:700px){.row{grid-template-columns:1fr}}
</style></head>
<body><main class="wrap"><div class="top"><a class="logo" href="/">PULSE</a><div><a class="btn" href="/dashboard.html">Dashboard</a> <a class="btn" href="/demo.html">Demo</a></div></div>
<h1>Incident Intelligence</h1><p style="color:#91a9cb">Live incident state from the PULSE API.</p><section id="list"><div class="empty">Loading incidents…</div></section></main>
<script>
async function load(){const el=document.getElementById('list');try{const r=await fetch('http://localhost:8080/api/incidents');if(!r.ok)throw new Error('API '+r.status);const data=await r.json();const arr=Array.isArray(data)?data:(data.incidents||[]);if(!arr.length){el.innerHTML='<div class="empty">No incidents returned by the API.</div>';return}el.innerHTML=arr.map(i=>`<article class="card"><div class="row"><div><div class="title">${esc(i.title||i.incident_key||'Incident')}</div><div class="meta">Service: <b>${esc(i.root_cause_service||'unknown')}</b><br>Started: ${esc(i.started_at||'unknown')}<br>Confidence: <b>${Math.round((Number(i.confidence)||0)*100)}%</b></div></div><span class="badge">${esc(i.severity||i.status||'UNKNOWN')}</span></div><div class="rca"><b>Root cause</b><br>${esc(i.root_cause||'Investigating')}</div></article>`).join('')}catch(e){el.innerHTML=`<div class="empty">Could not load the API. Make sure the Rust API is running at localhost:8080.<br><br>${esc(e.message)}</div>`}}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load();setInterval(load,5000);
</script></body></html>
