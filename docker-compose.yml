services:
  redpanda:
    image: redpandadata/redpanda:v24.3.5
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
      - --pandaproxy-addr
      - PLAINTEXT://0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - PLAINTEXT://redpanda:8082
    ports:
      - "9092:9092"
      - "8082:8082"

  console:
    image: redpandadata/console:v2.8.4
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda
    ports:
      - "8081:8080"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./infrastructure/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  processor:
    build:
      context: ./stream
    environment:
      KAFKA_BROKERS: redpanda:9092
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
      CLICKHOUSE_URL: http://clickhouse:8123
    depends_on:
      - redpanda
      - postgres
      - clickhouse

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgres://pulse:pulse@postgres:5432/pulse
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - postgres
      - redpanda
    ports:
      - "8080:8080"

  payment:
    build:
      context: ./services/payment
    environment:
      KAFKA_BROKERS: redpanda:9092
      SERVICE_NAME: payment
      PORT: "7001"
    depends_on:
      - redpanda
    ports:
      - "7001:7001"

  order:
    build:
      context: ./services/order
    environment:
      KAFKA_BROKERS: redpanda:9092
      PAYMENT_URL: http://payment:7001
      SERVICE_NAME: order
      PORT: "7002"
    depends_on:
      - payment
    ports:
      - "7002:7002"

  inventory:
    build:
      context: ./services/inventory
    environment:
      KAFKA_BROKERS: redpanda:9092
      SERVICE_NAME: inventory
      PORT: "7003"
    depends_on:
      - redpanda
    ports:
      - "7003:7003"

  gateway:
    build:
      context: ./services/gateway
    environment:
      KAFKA_BROKERS: redpanda:9092
      ORDER_URL: http://order:7002
      SERVICE_NAME: gateway
      PORT: "7000"
    depends_on:
      - order
    ports:
      - "7000:7000"

  dashboard:
    build:
      context: ./dashboard
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  pgdata:
  chdata:
